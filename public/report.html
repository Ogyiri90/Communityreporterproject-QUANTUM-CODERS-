<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report an issue — Community Reporter</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="report">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7z" fill="#0f766e"/>
          <circle cx="12" cy="9" r="2.6" fill="#fff"/>
        </svg>
        <span>Community <span class="brand-accent">Reporter</span></span>
      </a>
      <nav class="nav">
        <a href="index.html" class="nav-link">Reports</a>
        <a href="report.html" class="nav-link active">+ Report an issue</a>
        <span id="nav-actions" class="nav-actions"></span>
      </nav>
    </div>
  </header>

  <main class="container form-wrap">
    <h1>Report an issue</h1>
    <p class="muted">
      Tell us what is wrong and where. New reports start as <strong>Pending</strong> and can be
      marked <strong>Fixed</strong> when the problem is resolved.
    </p>

    <form id="report-form" class="card form-card">
      <label>Title *
        <input type="text" name="title" maxlength="150" required placeholder="e.g. Deep pothole on Nsawam Road" />
      </label>

      <div class="form-row">
        <label>Category *
          <select name="category" required>
            <option value="">Choose…</option>
            <option>Pothole</option>
            <option>Faulty Streetlight</option>
            <option>Waste &amp; Sanitation</option>
            <option>Water &amp; Drainage</option>
            <option>Other</option>
          </select>
        </label>
        <label>Location *
          <input type="text" name="location" maxlength="190" required placeholder="e.g. Kaneshie Market Road" />
        </label>
      </div>

      <label>Description *
        <textarea name="description" rows="5" required
          placeholder="Describe the issue, how long it has been there, and who it affects…"></textarea>
      </label>

      <label>Picture (optional, max 5 MB)
        <input type="file" name="photo" id="photo-input" accept="image/*" />
      </label>
      <img id="photo-preview" class="photo-preview hidden" alt="Picture preview" />

      <p class="form-error" id="form-error"></p>

      <div class="form-actions">
        <a class="btn btn-outline" href="index.html">Cancel</a>
        <button class="btn btn-primary" type="submit" id="submit-btn">Submit report</button>
      </div>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">Community Reporter</div>
  </footer>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
